name: Playwright CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        # Lệnh npm ci sẽ cài đặt đúng các package dựa trên file package-lock.json
        run: npm ci

      - name: Install Playwright Browsers & Dependencies
        # Bắt buộc phải có bước này để máy ảo GitHub cài đặt trình duyệt
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: npx playwright test
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}

      - name: Upload Playwright Report (Tùy chọn)
        # Bước này giúp bạn tải file báo cáo lỗi về xem nếu test bị failed (đỏ)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7